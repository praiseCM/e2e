   <g id="text_1">
    <text style="font-weight: 700; font-size: 13.1px; font-family: Arial, sans-serif; text-anchor: start; fill: #193146" x="15.1704" y="22.262781" transform="rotate(-0 15.1704 22.262781)">TWO COURSE-GROUNDED GENAI ACTIVITY SEQUENCES</text>
   </g>
   <g id="text_2">
    <text style="font-size: 9.7px; font-family: Arial, sans-serif; text-anchor: start; fill: #596a77" x="15.1704" y="36.493554" transform="rotate(-0 15.1704 36.493554)">Students begin with disciplinary work, consult a course chatbot, then evaluate and explain.</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 10.7px; font-family: Arial, sans-serif; text-anchor: start; fill: #0d6c73" x="17.172" y="53.132101" transform="rotate(-0 17.172 53.132101)">A  |  G1  •  INTRODUCTION TO CIVIL ENGINEERING</text>
   </g>
   <g id="text_4">
    <text style="font-size: 9.35px; font-family: Arial, sans-serif; text-anchor: start; fill: #596a77" x="17.172" y="67.284845" transform="rotate(-0 17.172 67.284845)">I2CE chatbot | Concept explanation and classroom discussion</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 9.55px; font-family: Arial, sans-serif; text-anchor: start; fill: #0d6c73" x="39.1896" y="95.149443" transform="rotate(-0 39.1896 95.149443)">1  WRITE FIRST</text>
   </g>
   <g id="text_6">
    <text style="font-size: 9.15px; font-family: Arial, sans-serif; text-anchor: start; fill: #193146" x="39.1896" y="117.462748" transform="rotate(-0 39.1896 117.462748)">Answer: “How do engineers</text>
   </g>
   <g id="text_7">
    <text style="font-size: 9.15px; font-family: Arial, sans-serif; text-anchor: start; fill: #193146" x="39.1896" y="134.280508" transform="rotate(-0 39.1896 134.280508)">communicate design ideas?”</text>
   </g>
   <g id="text_8">
    <text style="font-size: 9.15px; font-family: Arial, sans-serif; text-anchor: start; fill: #193146" x="39.1896" y="151.098268" transform="rotate(-0 39.1896 151.098268)">before using AI.</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 9.55px; font-family: Arial, sans-serif; text-anchor: start; fill: #0d6c73" x="201.3192" y="95.149443" transform="rotate(-0 201.3192 95.149443)">2  ASK I2CE</text>
   </g>
   <g id="text_10">
    <text style="font-size: 9.05px; font-family: Arial, sans-serif; text-anchor: start; fill: #193146" x="201.3192" y="117.435154" transform="rotate(-0 201.3192 117.435154)">Review course-grounded</text>
   </g>
   <g id="text_11">
    <text style="font-size: 9.05px; font-family: Arial, sans-serif; text-anchor: start; fill: #193146" x="201.3192" y="134.252914" transform="rotate(-0 201.3192 134.252914)">examples and explanations</text>
   </g>
   <g id="text_12">
    <text style="font-size: 9.05px; font-family: Arial, sans-serif; text-anchor: start; fill: #193146" x="201.3192" y="151.070674" transform="rotate(-0 201.3192 151.070674)">of communication methods.</text>
   </g>
   <g id="text_13">
    <text style="font-weight: 700; font-size: 9.55px; font-family: Arial, sans-serif; text-anchor: start; fill: #0d6c73" x="363.4488" y="95.149443" transform="rotate(-0 363.4488 95.149443)">3  DISCUSS &amp; REVISE</text>
   </g>
   <g id="text_14">
    <text style="font-size: 9.05px; font-family: Arial, sans-serif; text-anchor: start; fill: #193146" x="363.4488" y="117.435154" transform="rotate(-0 363.4488 117.435154)">Identify missing modes of</text>
   </g>
   <g id="text_15">
    <text style="font-size: 9.05px; font-family: Arial, sans-serif; text-anchor: start; fill: #193146" x="363.4488" y="134.252914" transform="rotate(-0 363.4488 134.252914)">communication; refine the</text>
   </g>
   <g id="text_16">
    <text style="font-size: 9.05px; font-family: Arial, sans-serif; text-anchor: start; fill: #193146" x="363.4488" y="151.070674" transform="rotate(-0 363.4488 151.070674)">response and explain why.</text>
   </g>
   <g id="text_17">
    <text style="font-weight: 700; font-size: 10.7px; font-family: Arial, sans-serif; text-anchor: start; fill: #aa5932" x="17.172" y="192.950341" transform="rotate(-0 17.172 192.950341)">B  |  G2  •  CONSTRUCTION PROJECT SCHEDULING</text>
   </g>
   <g id="text_18">
    <text style="font-size: 9.3px; font-family: Arial, sans-serif; text-anchor: start; fill: #596a77" x="17.172" y="207.089874" transform="rotate(-0 17.172 207.089874)">ScheduleAI chatbot | Townhouse schedule, 20-worker crew; rates in m² per worker-day</text>
   </g>
   <g id="text_19">
    <text style="font-weight: 700; font-size: 9.55px; font-family: Arial, sans-serif; text-anchor: start; fill: #aa5932" x="39.1896" y="235.297443" transform="rotate(-0 39.1896 235.297443)">1  CALCULATE</text>
   </g>
   <g id="text_20">
    <text style="font-size: 9.15px; font-family: Arial, sans-serif; text-anchor: start; fill: #193146" x="39.1896" y="257.610748" transform="rotate(-0 39.1896 257.610748)">1,000 ÷ (20 × 6)</text>
   </g>
   <g id="text_21">
    <text style="font-size: 9.15px; font-family: Arial, sans-serif; text-anchor: start; fill: #193146" x="39.1896" y="274.428508" transform="rotate(-0 39.1896 274.428508)">= 8.33 working days;</text>
   </g>
   <g id="text_22">
    <text style="font-size: 9.15px; font-family: Arial, sans-serif; text-anchor: start; fill: #193146" x="39.1896" y="291.246268" transform="rotate(-0 39.1896 291.246268)">round up → 9 days</text>
   </g>
   <g id="text_23">
    <text style="font-weight: 700; font-size: 9.55px; font-family: Arial, sans-serif; text-anchor: start; fill: #aa5932" x="201.3192" y="235.297443" transform="rotate(-0 201.3192 235.297443)">2  ASK SCHEDULEAI</text>
   </g>
   <g id="text_24">
    <text style="font-size: 9.05px; font-family: Arial, sans-serif; text-anchor: start; fill: #193146" x="201.3192" y="257.583154" transform="rotate(-0 201.3192 257.583154)">1,000 ÷ (20 × 7)</text>
   </g>
   <g id="text_25">
    <text style="font-size: 9.05px; font-family: Arial, sans-serif; text-anchor: start; fill: #193146" x="201.3192" y="274.400914" transform="rotate(-0 201.3192 274.400914)">= 7.14 working days;</text>
   </g>
   <g id="text_26">
    <text style="font-size: 9.05px; font-family: Arial, sans-serif; text-anchor: start; fill: #193146" x="201.3192" y="291.218674" transform="rotate(-0 201.3192 291.218674)">round up → 8 days</text>
   </g>
   <g id="text_27">
    <text style="font-weight: 700; font-size: 9.55px; font-family: Arial, sans-serif; text-anchor: start; fill: #aa5932" x="363.4488" y="235.297443" transform="rotate(-0 363.4488 235.297443)">3  VERIFY &amp; REVISE</text>
   </g>
   <g id="text_28">
    <text style="font-size: 9px; font-family: Arial, sans-serif; text-anchor: start; fill: #193146" x="363.4488" y="257.569357" transform="rotate(-0 363.4488 257.569357)">Check rate, crew, calendar</text>
   </g>
   <g id="text_29">
    <text style="font-size: 9px; font-family: Arial, sans-serif; text-anchor: start; fill: #193146" x="363.4488" y="274.387117" transform="rotate(-0 363.4488 274.387117)">and predecessor logic;</text>
   </g>
   <g id="text_30">
    <text style="font-size: 9px; font-family: Arial, sans-serif; text-anchor: start; fill: #193146" x="363.4488" y="291.204877" transform="rotate(-0 363.4488 291.204877)">justify any schedule edit.</text>
   </g>
   <g id="text_31">
    <text style="font-size: 8.25px; font-family: Arial, sans-serif; text-anchor: start; fill: #596a77" x="18.1728" y="317.708484" transform="rotate(-0 18.1728 317.708484)">Illustrative teaching activities; not measured performance. Chatbot use was optional.</text>
   </g>
  </g>
 </g>
